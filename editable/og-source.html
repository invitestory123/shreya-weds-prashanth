<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>og-image - Sreya &amp; Prashanth</title>
<style>
  /* Local copies of the invitation fonts (same files the site serves) */
  @font-face {
    font-family: 'Cinzel Decorative';
    font-weight: 700;
    font-display: block;
    src: url(../external/fonts.gstatic.com/s/cinzeldecorative/v19/cinzel-decorative-700.woff2) format('woff2');
  }
  @font-face {
    font-family: 'Marcellus';
    font-weight: 400;
    font-display: block;
    src: url(../external/fonts.gstatic.com/s/marcellus/v14/wEO_EBrOk8hQLDvIAF8FVPAN3Eo.woff2) format('woff2');
  }
  @font-face {
    font-family: 'Cormorant Garamond';
    font-style: italic;
    font-weight: 400;
    font-display: block;
    src: url(../external/fonts.gstatic.com/s/cormorantgaramond/v21/co3smX5slCNuHLi8bLeY9MK7whWMhyjYrGFEsdtdc62E6zd58jDOjNk9IfqxUQ.woff) format('woff');
  }
  @font-face {
    font-family: 'Karla';
    font-weight: 400;
    font-display: block;
    src: url(../external/fonts.gstatic.com/s/karla/v33/qkBbXvYC6trAT4RXJNu25A.woff2) format('woff2');
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
  }

  body {
    position: relative;
    font-family: 'Marcellus', Georgia, serif;
    color: #231613;
    background:
      radial-gradient(900px 520px at 50% -12%, rgba(201, 162, 78, 0.20), rgba(201, 162, 78, 0) 62%),
      radial-gradient(700px 420px at 50% 118%, rgba(178, 140, 85, 0.16), rgba(178, 140, 85, 0) 60%),
      linear-gradient(178deg, #fdf9f0 0%, #faf3e4 55%, #f7efdd 100%);
  }

  /* paper grain */
  body::after {
    content: "";
    position: absolute;
    inset: 0;
    opacity: 0.5;
    pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='240' height='240' filter='url(%23n)' opacity='0.055'/></svg>");
  }

  /* double gold frame */
  .frame-outer {
    position: absolute;
    inset: 20px;
    border: 1.5px solid rgba(176, 141, 74, 0.72);
    pointer-events: none;
  }
  .frame-inner {
    position: absolute;
    inset: 29px;
    border: 1px solid rgba(176, 141, 74, 0.34);
    pointer-events: none;
  }
  .corner {
    position: absolute;
    width: 9px;
    height: 9px;
    background: #b0894a;
    transform: rotate(45deg);
    box-shadow: 0 0 0 3px rgba(250, 244, 231, 0.9);
  }
  .corner.tl { top: 16px; left: 16px; }
  .corner.tr { top: 16px; right: 16px; }
  .corner.bl { bottom: 16px; left: 16px; }
  .corner.br { bottom: 16px; right: 16px; }

  /* Kolkata -> Hyderabad crest as a soft watermark band */
  .crest {
    position: absolute;
    left: 50%;
    bottom: -6px;
    transform: translateX(-50%);
    width: 1060px;
    opacity: 0.16;
    filter: sepia(0.15);
    pointer-events: none;
  }

  .vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(120% 90% at 50% 45%, rgba(255, 255, 255, 0) 55%, rgba(146, 116, 66, 0.10) 100%);
  }

  .content {
    position: relative;
    z-index: 3;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 44px 70px 52px;
  }

  .monogram {
    width: 116px;
    height: auto;
    display: block;
    filter: drop-shadow(0 6px 14px rgba(160, 124, 60, 0.28));
  }

  .shloka {
    margin-top: 14px;
    font-family: 'Nirmala UI', 'Mangal', 'Noto Serif Devanagari', serif;
    font-size: 21px;
    letter-spacing: 0.06em;
    color: #7a5a25;
  }

  .names {
    margin-top: 16px;
    font-family: 'Cinzel Decorative', 'Marcellus', Georgia, serif;
    font-weight: 700;
    font-size: 63px;
    line-height: 1.05;
    letter-spacing: 0.065em;
    text-transform: uppercase;
    color: #231613;
    text-shadow: 0 1px 0 rgba(255, 255, 255, 0.75);
    white-space: nowrap;
  }
  .names .amp {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic;
    font-weight: 400;
    font-size: 55px;
    color: #b0894a;
    padding: 0 16px;
    letter-spacing: 0;
  }

  .rule {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 20px;
    width: 430px;
  }
  .rule .line {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, rgba(176, 137, 74, 0), rgba(176, 137, 74, 0.85), rgba(176, 137, 74, 0));
  }
  .rule .diamond {
    width: 8px;
    height: 8px;
    background: #b0894a;
    transform: rotate(45deg);
  }

  .date {
    margin-top: 20px;
    font-family: 'Marcellus', Georgia, serif;
    font-size: 31px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: #2b1c16;
  }

  .venue {
    margin-top: 12px;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic;
    font-size: 25px;
    letter-spacing: 0.02em;
    color: #4a3a30;
  }

  .kicker {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 44px;
    z-index: 4;
    font-family: 'Karla', sans-serif;
    font-size: 13.5px;
    font-weight: 600;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: #52101f;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="frame-outer"></div>
  <div class="frame-inner"></div>
  <span class="corner tl"></span>
  <span class="corner tr"></span>
  <span class="corner bl"></span>
  <span class="corner br"></span>

  <img class="crest" src="./assets/kolkata-hyderabad-crest.png" alt="" />
  <div class="vignette"></div>

  <div class="content">
    <img class="monogram" src="./assets/sp-monogram.png" alt="S&amp;P monogram" />
    <div class="shloka">&#2405; &#2358;&#2381;&#2352;&#2368; &#2327;&#2339;&#2375;&#2358;&#2366;&#2351; &#2344;&#2350;&#2307; &#2405;</div>
    <div class="names">Sreya<span class="amp">&amp;</span>Prashanth</div>
    <div class="rule"><span class="line"></span><span class="diamond"></span><span class="line"></span></div>
    <div class="date">15 March 2027 &#183; 7:00 PM onwards</div>
    <div class="venue">Sandhan Banquet &#183; Belgharia, Kolkata</div>
  </div>

  <div class="kicker">Two cultures, one heart &#183; Kolkata to Hyderabad</div>
</body>
</html>
